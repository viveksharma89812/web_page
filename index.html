
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday 🎂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffe0ec, #e5d5ff);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    text-align: center;
    padding: 25px;
    width: 100%;
}

h1 {
    color: #e84393;
    font-size: clamp(30px, 6vw, 55px);
    animation: fadeIn 2s ease;
}

.name {
    color: #8e44ad;
    font-size: clamp(22px, 4vw, 32px);
    margin: 20px 0;
}

.cake {
    font-size: 100px;
    margin: 20px;
    animation: bounce 2s ease-in-out infinite;
}

.message {
    color: #555;
    font-size: clamp(15px, 3vw, 19px);
    line-height: 1.7;
}

button {
    background: #e84393;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 25px;
    margin-top: 25px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #c21870;
}

#surprise {
    display: none;
    margin-top: 20px;
    color: #e84393;
    font-size: 20px;
    animation: fadeIn 1s ease;
}

/* Simple Animations */

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* Floating Balloons */

.balloon {
    position: absolute;
    bottom: -100px;
    font-size: 40px;
    animation: floatUp 10s linear infinite;
    pointer-events: none;
}

@keyframes floatUp {
    from { transform: translateY(0); }
    to { transform: translateY(-120vh); }
}

.b1 { left: 10%; animation-delay: 0s; }
.b2 { left: 30%; animation-delay: 3s; }
.b3 { left: 70%; animation-delay: 1s; }
.b4 { left: 90%; animation-delay: 5s; }

/* Mobile */

@media(max-width: 600px) {
    .cake {
        font-size: 80px;
    }

    .container {
        padding: 15px;
    }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
    }
}
</style>
</head>

<body>

<div class="balloon b1">🎈</div>
<div class="balloon b2">🎈</div>
<div class="balloon b3">🎈</div>
<div class="balloon b4">🎈</div>

<div class="container">

    <h1>🎉 Happy Birthday 🎉</h1>

    <div class="name">Dear Birthday Star ❤️</div>

    <div class="cake">🎂</div>

    <div class="message">
        Wishing you a very Happy Birthday! 🥳<br>
        May your day be filled with happiness,<br>
        love, laughter and beautiful memories. 💖
    </div>

    <button onclick="showMessage()">
        🎁 Click for Surprise
    </button>

    <div id="surprise">
        ❤️ You are Special! ❤️<br>
        Have a Wonderful Year Ahead! 🎂
    </div>

</div>

<script>
function showMessage() {
    document.getElementById("surprise").style.display = "block";
}
</script>

</body>
</html>
