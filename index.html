<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Thanks for Everything</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #f9a8d4;
      --accent-2: #c4b5fd;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(168, 85, 247, .28), transparent 40%),
        radial-gradient(ellipse at 85% 80%, rgba(236, 72, 153, .22), transparent 38%),
        linear-gradient(135deg, #0f172a, #111827 55%, #1e1b4b);
    }

    .glow {
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      filter: blur(85px);
      opacity: .25;
      pointer-events: none;
      animation: float 9s ease-in-out infinite alternate;
    }
    .glow.one { top: -120px; left: -100px; background: #a855f7; }
    .glow.two { right: -120px; bottom: -130px; background: #ec4899; animation-delay: -4s; }

    .card {
      position: relative;
      width: min(100%, 760px);
      padding: clamp(32px, 7vw, 72px) clamp(22px, 6vw, 64px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 30px;
      background: rgba(255,255,255,.075);
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: appear .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .heart {
      display: inline-grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin-bottom: 25px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 24px;
      color: #fbcfe8;
      background: rgba(249,168,212,.12);
      font-size: 36px;
      animation: heartbeat 2.2s ease-in-out infinite;
    }

    .eyebrow {
      margin-bottom: 14px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 5.4rem);
      line-height: 1.04;
      letter-spacing: -.055em;
      font-weight: 800;
      text-wrap: balance;
    }

    h1 span {
      display: block;
      padding-bottom: .12em;
      color: transparent;
      background: linear-gradient(100deg, #f9a8d4, #ddd6fe 55%, #fbcfe8);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .message {
      max-width: 510px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.8;
    }

    .divider {
      width: 76px;
      height: 3px;
      margin: 30px auto;
      border-radius: 999px;
      background: linear-gradient(90deg, #f9a8d4, #c4b5fd);
    }

    .signoff {
      color: #f1f5f9;
      font-size: .98rem;
      letter-spacing: .04em;
    }

    .sparkle {
      position: absolute;
      color: rgba(255,255,255,.7);
      font-size: 20px;
      animation: twinkle 3s ease-in-out infinite;
      user-select: none;
    }
    .s1 { top: 13%; left: 12%; }
    .s2 { top: 20%; right: 11%; animation-delay: .8s; font-size: 14px; }
    .s3 { bottom: 15%; left: 16%; animation-delay: 1.5s; font-size: 14px; }
    .s4 { bottom: 13%; right: 14%; animation-delay: .4s; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(22px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      12% { transform: scale(1.08); }
      24% { transform: scale(1); }
      36% { transform: scale(1.05); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .35; transform: scale(.85) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(20deg); }
    }
    @keyframes float {
      from { transform: translate(0, 0); }
      to { transform: translate(35px, -25px); }
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { border-radius: 24px; }
      .heart { width: 64px; height: 64px; border-radius: 20px; font-size: 30px; margin-bottom: 22px; }
      .message { line-height: 1.7; }
      .sparkle.s1 { left: 6%; }
      .sparkle.s2 { right: 6%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>

  <main class="card">
    <span class="sparkle s1" aria-hidden="true">✦</span>
    <span class="sparkle s2" aria-hidden="true">✧</span>
    <span class="sparkle s3" aria-hidden="true">✧</span>
    <span class="sparkle s4" aria-hidden="true">✦</span>

    <div class="heart" aria-hidden="true">♡</div>
    <p class="eyebrow">With heartfelt gratitude</p>
    <h1>Thanks <span>for Everything</span></h1>
    <p class="message">
      For every little thing, every kind word, every moment, and every bit of support —
      thank you. It all means more than words can say.
    </p>
    <div class="divider" aria-hidden="true"></div>
    <p class="signoff">Truly grateful, always. ✨</p>
  </main>
</body>
</html>
